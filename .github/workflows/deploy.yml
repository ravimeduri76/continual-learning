name: Deploy The Forgetting Machine to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build self-contained page
        working-directory: src
        env:
          # Optional: set repo secret FEEDBACK_ENDPOINT to a Formspree / Apps Script URL.
          # Absent -> ratings are still stored in the player's localStorage, just not POSTed.
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
        run: python3 build.py

      - name: Verify build (runtime guard + learner tests)
        working-directory: src
        run: |
          node verify_build.js
          node test_learners.js > /dev/null

      - name: Assemble site
        run: |
          mkdir -p public
          cp src/game.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
